# conf/layer.conf for a small product layer sitting on top of meta-raspberrypi.
# Replace "camera" with your layer collection name (lowercase, unique).
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "camera"
BBFILE_PATTERN_camera = "^${LAYERDIR}/"
BBFILE_PRIORITY_camera = "10"

LAYERDEPENDS_camera = "core raspberrypi"
# Must list the Yocto release(s) you built against. Verified: scarthgap.
LAYERSERIES_COMPAT_camera = "scarthgap"
